<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=favorite"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Open Sans", sans-serif;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #001;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row-reverse;
      }
      form {
        height: 800px;
        width: 600px;
        border: 2px solid white;
        border-radius: 5px;
        background-color: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .username {
        width: 80%;
        height: 5%;
        margin-bottom: 2vw;
        color: black;
        padding: 1vw;
        font-size: 18px;
        font-weight: 500;
      }
      .pass-container {
        width: 80%;
        height: 5%;
        display: flex;
        justify-content: space-between;
      }
      .password {
        width: 85%;
        height: 5%;
        margin-bottom: 2vw;
        color: black;
        padding: 1vw;
        font-size: 18px;
        font-weight: 500;
      }
      .view {
        height: 100%;
        width: 10%;
        background-color: rgb(11, 25, 219);
        border-radius: 10px;
        color: white;
        transition: all 0.25s ease-in-out;
        &:hover {
          cursor: pointer;
          scale: 1.1;
          background-color: royalblue;
        }
      }
      .title {
        font-size: 30px;
        font-weight: 600;
        color: white;
        margin-bottom: 8vw;
      }
      .btn {
        width: 80%;
        height: 8%;
        background-color: black;
        color: white;
        font-size: 20px;
        font-weight: bolder;
        border: none;
        border-radius: 10px;
        margin-top: 3vw;
        transition: all 0.33s ease-in-out;
        &:hover {
          background-color: rgb(5, 5, 8);
          cursor: pointer;
          scale: 0.9;
          border: 1px solid white;
        }
      }
    </style>
  </head>
  <body>
    <form>
      <div class="title">
        Login | <span style="color: rgb(29, 61, 204)">BLOGIFY</span>
      </div>
      <input type="text" class="username" placeholder="username" />
      <div class="pass-container">
        <input type="password" class="password" placeholder="password" />
        <button class="view">View</button>
      </div>
      <button class="btn" type="submit">submit</button>
    </form>
    <script>
      document.body.querySelector(".view").addEventListener("click", (e) => {
        e.preventDefault();

        if (document.body.querySelector(".password").value) {
          if (document.body.querySelector(".view").textContent == "View") {
            document.body.querySelector(".view").textContent = "hide";
          } else {
            document.body.querySelector(".view").textContent = "View";
          }

          if (document.body.querySelector(".password").type == "text") {
            document.body.querySelector(".password").type = "password";
          } else {
            document.body.querySelector(".password").type = "text";
          }
        }
      });

      document.body.querySelector(".btn").addEventListener("click", (e) => {
        e.preventDefault();
        const register = async () => {
          const response = await fetch("/api/v1/users/login", {
            method: "POST",
            body: JSON.stringify({
              username: document.body.querySelector(".username").value,
              password: document.body.querySelector(".password").value,
            }),
            headers: {
              "Content-Type": "application/json",
            },
          });
          const data = await response.json();
          if(data.statuscode === 200){
            alert("user registered sucessfully !")
            return window.location.href = "/"
          }
        };
        register();
      });
    </script>
  </body>
</html>
