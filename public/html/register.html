<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>register</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=favorite"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Open Sans", sans-serif;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #001;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row-reverse;
      }
      form {
        height: 800px;
        width: 600px;
        border: 2px solid white;
        border-radius: 5px;
        background-color: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .username {
        width: 80%;
        height: 5%;
        margin-bottom: 2vw;
        color: black;
        padding: 1vw;
        font-size: 18px;
        font-weight: 500;
      }
      .pass-container {
        width: 80%;
        height: 5%;
        display: flex;
        justify-content: space-between;
      }
      .password {
        width: 85%;
        height: 5%;
        margin-bottom: 2vw;
        color: black;
        padding: 1vw;
        font-size: 18px;
        font-weight: 500;
      }
      .view {
        height: 100%;
        width: 10%;
        background-color: rgb(11, 25, 219);
        border-radius: 10px;
        color: white;
        transition: all 0.25s ease-in-out;
        &:hover {
          cursor: pointer;
          scale: 1.1;
          background-color: royalblue;
        }
      }
      .profile {
        font-size: 20px;
        color: white;
        text-align: center;
        margin: 2.5vw 0;
        width: 60%;
      }
      .title {
        font-size: 30px;
        font-weight: 600;
        color: white;
      }
      .line {
        margin-top: 2vw;
        width: 100%;
        border: 1px solid white;
      }
      .profile-container {
        margin-top: 5vw;
        height: 200px;
        width: 200px;
        background-color: black;
        border-radius: 5px;
      }
      #pp {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .btn {
        width: 80%;
        height: 8%;
        background-color: black;
        color: white;
        font-size: 20px;
        font-weight: bolder;
        border: none;
        border-radius: 10px;
        margin-top: 3vw;
        transition: all 0.33s ease-in-out;
        &:hover {
          background-color: rgb(5, 5, 8);
          cursor: pointer;
          scale: 0.9;
          border: 1px solid white;
        }
      }
      .password-recommendation {
        margin-top: 20vw;
        margin-left: 3vw;
        width: 500px;
        padding: 2vw;
        border-radius: 10px;
        background-color: rgb(29, 61, 204);
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="password-recommendation">
      <span style="font-weight: bold; text-decoration: underline">Password Characteristics</span>
      <ul>
        <li>Must be atleast 6 digits longs</li>
        <li>Must have atleast one Capital letter [A , B , Z, E ...]</li>
        <li>Must have atleast one numeric value [1,2,3,4 ... ]</li>
        <li>must have atleast one special Character [@,5,$,& ... ]</li>
      </ul>
    </div>
    <form>
      <span class="title"
        >Register | <span style="color: rgb(29, 61, 204)">BLOGIFY</span>
      </span>
      <div class="line"></div>
      <div class="profile-container">
        <img src="../image/pp.png" id="pp" />
      </div>
      <input type="file" class="profile" />
      <input type="text" class="username" placeholder="username" />
      <div class="pass-container">
        <input type="password" class="password" placeholder="password" />
        <button class="view">View</button>
      </div>
      <button class="btn" type="submit">submit</button>
    </form>
    <script>
      document.body
        .querySelector(".password")
        .addEventListener("input", (e) => {
          e.preventDefault();
          document.body.querySelector(".password-recommendation").style.display = "block";
        });

      document.body.querySelector(".profile").addEventListener("input", (e) => {
        e.preventDefault();
        const file = document.body.querySelector(".profile").files[0];
        if (file) {
          document.body.querySelector("#pp").src = URL.createObjectURL(file);
        }
      });

      document.body.querySelector(".view").addEventListener("click", (e) => {
        e.preventDefault();
        if (document.body.querySelector(".password").type == "text") {
          document.body.querySelector(".password").type = "password";
        } else {
          document.body.querySelector(".password").type = "text";
        }
      });

      document.body.querySelector(".btn").addEventListener("click", (e) => {
        e.preventDefault();
        if (
          !(
            document.body.querySelector(".password").value &&
            document.body.querySelector(".username").value &&
            document.body.querySelector(".profile").files[0]
          )
        ) {
          alert("data is missing !");
          return;
        }
        const formData = new FormData();
        formData.append(
          "username",
          document.body.querySelector(".username").value
        );
        formData.append(
          "password",
          document.body.querySelector(".password").value
        );
        formData.append(
          "profile",
          document.body.querySelector(".profile").files[0]
        );
        const register = async () => {
          const response = await fetch("/api/v1/users/register", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();
          if(data.statuscode === 200){
            alert("user created sucessfully !")
            return window.location.href = "/html/login.html"
          }
          else if(data.statuscode === 400){
            alert("user already exits")
          }
        };
        register();
      });
    </script>
  </body>
</html>
